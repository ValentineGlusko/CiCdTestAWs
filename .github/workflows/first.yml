
name: DeployToEc2

on:
  workflow_dispatch:
    inputs:
      IS_LOCAL:
        default: true
        required: true
        type: boolean
      PROFILE_NAME:
        default: valentine
        required: false
        type: string

permissions:
  contents: read

jobs:
  first_job:
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: stop systemctl
        run: |
          sudo systemctl stop fastserver
          echo "STATUS:"
          sudo systemctl status fastserver || true
      - name: Install pip
        run: sudo apt update && sudo apt install -y python3-pip python3-venv
      - name: Move to userfolder
        run: | 
          rm -r ~/CiCdTestAWs
          cp -r ~/actions-runner/_work/CiCdTestAWs ~/ --force
          sudo chmod 777 ~/CiCdTestAWs/CiCdTestAWs/start.sh
          python3 -m venv ~/CiCdTestAWs/CiCdTestAWs/venv
          ~/CiCdTestAWs/CiCdTestAWs/venv/bin/python -m pip install -r requirements.txt    
      - name: run service
        run: sudo systemctl start fastserver
